<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>管理后台 | AI科技前沿 · 学习交流</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260819c">
  <link rel="stylesheet" href="css/admin.css?v=20260819c">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="admin-body">

  <!-- ===== 登录页 ===== -->
  <div class="login-page" id="loginPage">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 32 32" width="48" height="48" fill="none">
          <rect x="2" y="2" width="28" height="28" rx="8" stroke="url(#adminLogoGrad)" stroke-width="2"/>
          <path d="M10 12c0-2 2-4 6-4s6 2 6 4-2 3-4 4-4 2-4 4" stroke="url(#adminLogoGrad)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="16" cy="24" r="1.5" fill="url(#adminLogoGrad)"/>
          <defs><linearGradient id="adminLogoGrad" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#00d4ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient></defs>
        </svg>
        <h1>AI科技前沿 · 学习交流 · 管理后台</h1>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="loginPassword">管理员密码</label>
          <input type="password" id="loginPassword" placeholder="请输入管理密码" required autocomplete="current-password">
        </div>
        <div class="login-error" id="loginError"></div>
        <button type="submit" class="btn btn--primary btn--block" id="loginBtn">登 录</button>
      </form>
      <div class="login-hint" id="loginHint">
        <p>首次使用？请先在 Cloudflare Pages 环境变量中设置 <code>ADMIN_PASSWORD</code></p>
      </div>
    </div>
  </div>

  <!-- ===== 管理面板 ===== -->
  <div class="admin-app" id="adminApp" style="display:none">
    <!-- 顶栏 -->
    <header class="admin-header">
      <div class="admin-header__left">
        <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="切换侧边栏">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="admin-header__title">AI科技前沿 · 学习交流 · 管理后台</span>
      </div>
      <div class="admin-header__right">
        <button class="btn btn--outline btn--sm" id="initBtn" title="初始化数据（补全模式：只补缺失，保留全部现有内容）">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 3v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          初始化数据
        </button>
        <button class="btn btn--ghost btn--sm" id="logoutBtn" title="退出登录">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round"/><polyline points="16 17 21 12 16 7" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="12" x2="9" y2="12" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="admin-layout">
      <!-- 侧边栏 -->
      <aside class="admin-sidebar" id="adminSidebar">
        <nav class="admin-nav">
          <a class="admin-nav__item active" data-section="dashboard">
            <span class="admin-nav__icon">📊</span>
            <span>仪表盘</span>
          </a>
          <a class="admin-nav__item" data-section="articles">
            <span class="admin-nav__icon">📰</span>
            <span>AI 要闻</span>
          </a>
          <a class="admin-nav__item" data-section="skills">
            <span class="admin-nav__icon">🎓</span>
            <span>技能分享</span>
          </a>
          <a class="admin-nav__item" data-section="videos">
            <span class="admin-nav__icon">🎬</span>
            <span>视频教程</span>
          </a>
          <a class="admin-nav__item" data-section="discussions">
            <span class="admin-nav__icon">💬</span>
            <span>社区讨论</span>
          </a>
          <a class="admin-nav__item" data-section="members">
            <span class="admin-nav__icon">👥</span>
            <span>成员管理</span>
          </a>
          <a class="admin-nav__item" data-section="comments">
            <span class="admin-nav__icon">🕐</span>
            <span>评论审核</span>
          </a>
          <a class="admin-nav__item" data-section="contributors">
            <span class="admin-nav__icon">🏆</span>
            <span>贡献者</span>
          </a>
          <a class="admin-nav__item" data-section="pages">
            <span class="admin-nav__icon">📄</span>
            <span>页面管理</span>
          </a>
          <a class="admin-nav__item" data-section="config">
            <span class="admin-nav__icon">⚙️</span>
            <span>网站配置</span>
          </a>
        </nav>
        <div class="admin-sidebar__footer">
          <a href="/" target="_blank" class="admin-nav__item">
            <span class="admin-nav__icon">🔗</span>
            <span>访问前台</span>
          </a>
        </div>
      </aside>

      <!-- 主内容区 -->
      <main class="admin-main" id="adminMain">
        <!-- 动态渲染 -->
      </main>
    </div>
  </div>

  <!-- ===== 模态框 ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal__header">
        <h3 id="modalTitle">编辑</h3>
        <button class="modal__close" id="modalClose" aria-label="关闭">&times;</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- ===== Toast 通知 ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== 确认对话框 ===== -->
  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal modal--confirm">
      <div class="modal__header">
        <h3 id="confirmTitle">确认</h3>
      </div>
      <div class="modal__body">
        <p id="confirmText">确定要执行此操作吗？</p>
      </div>
      <div class="modal__footer">
        <button class="btn btn--outline btn--sm" id="confirmCancel">取消</button>
        <button class="btn btn--primary btn--sm" id="confirmOk">确认</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/admin.js?v=20260819c"></script>
</body>
</html>
