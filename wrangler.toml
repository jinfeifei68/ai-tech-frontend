# Cloudflare Pages 本地开发配置
# 用于 wrangler pages dev 本地调试 Functions + KV

name = "ai-tech-frontend"
compatibility_date = "2024-12-01"
pages_build_output_dir = "."

# KV 命名空间绑定（本地开发用占位 ID，生产环境在 Cloudflare Dashboard 配置）
[[kv_namespaces]]
binding = "CONTENT_KV"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

# 管理员密码（本地开发用，生产环境在 Cloudflare Dashboard 设置环境变量）
[vars]
ADMIN_PASSWORD = "change-me-to-your-secure-password"
